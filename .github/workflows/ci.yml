name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    uses: burin-labs/.github/.github/workflows/harn-package.yml@c5c3362bd344a549d6e5ed5418d5932405443738

  canon-contract:
    name: Canon structure and fixture validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Harn
        id: harn
        uses: burin-labs/harn/.github/actions/setup-harn@e2089cd9628995bf2080cd1515086a891dff34f4
      - name: Validate canon packs
        shell: bash
        run: harn run scripts/validate-canon.harn -- --today "$(date -u +%F)"
      - name: Verify typed Flow capability boundary
        run: >-
          harn run --no-sandbox scripts/assert-flow-capability-contract.harn --
          --harn-bin "${{ steps.harn.outputs.path }}"
      - name: Execute deterministic fixture cases
        run: harn run scripts/execute-fixtures.harn

  status:
    name: CI status
    if: always()
    needs: [package, canon-contract]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required jobs
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          CANON_RESULT: ${{ needs.canon-contract.result }}
        run: test "$PACKAGE_RESULT" = success && test "$CANON_RESULT" = success
