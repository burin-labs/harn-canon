name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    uses: burin-labs/.github/.github/workflows/harn-package.yml@1acf9aba857a8eb512014d7097bfb22b2e751ff8

  canon-contract:
    name: Canon structure and fixture validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Harn
        uses: burin-labs/harn/.github/actions/setup-harn@e2089cd9628995bf2080cd1515086a891dff34f4
      - name: Validate canon packs
        shell: bash
        run: HARN_CANON_TODAY="$(date -u +%F)" harn run scripts/validate-canon.harn
      - name: Reject side-effect builtins in predicates
        shell: bash
        run: |
          set -euo pipefail
          if grep -nrE '\b(command_json|http_get|http_post|process_exec|secret_get|store_set|store_get)\s*\(' --include='*.harn' .; then
            echo "::error::Predicate packs may not call side-effect builtins." >&2
            exit 1
          fi
      - name: Execute deterministic fixture cases
        run: harn run scripts/execute-fixtures.harn

  status:
    name: CI status
    if: always()
    needs: [package, canon-contract]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required jobs
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          CANON_RESULT: ${{ needs.canon-contract.result }}
        run: test "$PACKAGE_RESULT" = success && test "$CANON_RESULT" = success
